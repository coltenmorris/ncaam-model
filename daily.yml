# Runs the NCAAM model on GitHub's servers every day and publishes the
# dashboard to GitHub Pages. 15:07 UTC = 10:07 AM Eastern, 22:07 UTC = 5:07 PM
# Eastern in winter. It finds main.py wherever it sits in the repo.
name: Daily NCAAM update

on:
  schedule:
    - cron: "7 15 * * *"
    - cron: "7 22 * * *"
    - cron: "37 6 * * *"     # 1:37 AM Eastern: grades the night's games
  workflow_dispatch:
    inputs:
      date:
        description: "Date to run (today, tomorrow, or YYYY-MM-DD)"
        required: false
        default: "today"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ncaam-daily
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/New_York
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Find the project files
        run: |
          echo "Files in the repo:"
          git ls-files
          MAIN=$(git ls-files | grep -E '(^|/)main\.py$' | head -1)
          if [ -z "$MAIN" ]; then
            echo "::error::main.py is not in the repo. Upload it, then run again."
            exit 1
          fi
          PROJ=$(dirname "$MAIN")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project folder: $PROJ"
          for f in config.py espn.py markets.py model.py names.py odds_api.py report.py torvik.py tracker.py web.py; do
            [ -f "$PROJ/$f" ] || { echo "::error::$f is missing next to main.py. Upload it, then run again."; MISSING=1; }
          done
          [ -z "$MISSING" ] || exit 1

      - name: Install requirements
        run: pip install requests pandas openpyxl

      - name: Run the model
        working-directory: ${{ env.PROJ }}
        run: python main.py --date "${{ github.event.inputs.date || 'today' }}"

      - name: Save results to the repository
        working-directory: ${{ env.PROJ }}
        run: |
          git config user.name  "ncaam-model-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily update $(date +'%Y-%m-%d %H:%M %Z')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 10
            done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJ }}/docs

      - name: Publish the web page
        id: deploy
        uses: actions/deploy-pages@v4
